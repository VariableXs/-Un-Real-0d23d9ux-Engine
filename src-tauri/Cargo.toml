[workspace]
members = [".", "crates/container"]

[package]
name = "variable"
version = "1.0.0"
description = "Variable — Private Space"
authors = ["Variable"]
edition = "2021"

[lib]
name = "variable_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 批次 B-2：存储容器层骨架（StorageBackend trait + DirBackend）
container = { path = "crates/container" }
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
git2 = { version = "0.19", default-features = false }
blake3 = "1"
ssh-key = { version = "0.6", features = ["ed25519", "std"] }
iced-x86 = "1.21"
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
# AI-09 文件操作组：校验和（md5/sha1）+ 压缩包只读浏览（zip）
md-5 = "0.10"
sha1 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
sysinfo = "0.30"
# 批次E-7：隐私保险箱（AES-256-GCM + PBKDF2）与随机数（nonce/盐/覆写）
aes-gcm = "0.10"
pbkdf2 = "0.12"
hmac = "0.12"
rand = "0.8"
# X-1 扩展桥：base64（签名/资产路径）+ url（asset 协议 URL）
base64 = "0.22"
url = "2"
# 批次C-2：窗口标题正则兜底匹配（登记可选）
regex = "1"
# X-4 插件扩展：动态库加载（计划指定 libloading）
libloading = "0.8"
# AI-10 存档柜（U-29）：.vxa 归档逐条目 zstd 压缩帧
zstd = "0.13"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows = { version = "0.58", features = [
  "Foundation",
  "Foundation_Collections",
  "Devices_Bluetooth",
  "Devices_Enumeration",
  "Devices_Radios",
  "Win32_Foundation",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_Properties",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Printing",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_NetworkManagement_WiFi",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_Storage_FileSystem",
  "Win32_System_WindowsProgramming",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
  "Win32_System_Time",
  "Win32_System_LibraryLoader",
        "Win32_System_Threading",
        "Win32_System_DataExchange",
  "Win32_System_RestartManager",
  "Win32_System_IO",
  "Win32_System_Shutdown",
  "Win32_System_Power",
  "Win32_System_Variant",
  "Win32_System_Wmi",
  "Win32_Devices_FunctionDiscovery",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Controls",
  "Win32_Graphics_Dwm",
  "Win32_Storage_Packaging_Appx",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_Ime",
  "Media_Control",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Security_WinTrust",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
] }

[features]
# L-1：VM 档引擎内 agent（心跳 47631 + 退出通知宿主卸盘）。VM 镜像构建时启用。
vm-agent = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true


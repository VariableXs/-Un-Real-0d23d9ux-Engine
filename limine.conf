# Varix 内核 Limine 配置（v8+ limine.conf 格式；随 ISO 打包到根目录）
# 引导设施红线（2026-09-22 实机事故）：本文件 = 真机部署唯一事实源，
# **禁止**在此添加 kernel_cmdline: storage_selftest=1 —— 那会解锁内核
# NVMe 直写探针，把内置系统盘（Windows 引导盘）当测试盘写坏（GPT/ESP）。
# QEMU 刮擦盘验收请用 _attic/limine-qemu-selftest.conf（--conf 传入）。
#
# 引导红线二（2026-09-26 U 盘循环事故）：kernel_cmdline 行**不可缺失**。
# 缺失时内核收不到 boot_timeout=0，回退走 bootselect 菜单路径；真机桌面
# 引导一旦 panic 即自动复位，形成「菜单→legend→复位」死循环。
# 桌面直进必须保留 desktop=1 boot_timeout=0（与 build-hdd.py 生产 conf
# 同源）；panic_halt=1 为排障期旗标（panic 停机不复位，错误码可拍摄）。
#
# 元数据（WP-101 · MD2 篇 1.3；内核侧 bootconf.rs 是唯一解析面）：
#   interface_version = varix-bli-1（契约版本标记，磁盘可查）。
#   hash = 正文校验和：FNV-1a 32 位（与内核 bootchain::hash_bytes 同源），
#   覆盖首个非注释非空行起至文件末尾的全部字节；头部注释不参与。
#   正文被意外篡改时以此行复核（闸门「目标可信」的配置面）。
# interface_version: varix-bli-1
# hash: f1d824be
timeout: 5
serial: yes
default_entry: 0

/kernel/varix
    protocol: limine
    kernel_path: boot():/kernel/varix
    kernel_cmdline: desktop=1 boot_timeout=0 panic_halt=1
    comment: VARIX kernel (STAR I)

/Windows 11 (USB)
    protocol: efi
    path: guid(636786cb-e967-49f6-b0df-7608909d1f11):/EFI/Microsoft/Boot/bootmgfw.efi
    comment: handoff target (WINESP 636786cb-e967-49f6-b0df-7608909d1f11)

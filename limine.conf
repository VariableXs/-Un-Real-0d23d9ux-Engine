# Varix 内核 Limine 配置（v8+ limine.conf 格式；随 ISO 打包到根目录）
# 引导设施红线（2026-09-22 实机事故）：本文件 = 真机部署唯一事实源，
# **禁止**在此添加 kernel_cmdline: storage_selftest=1 —— 那会解锁内核
# NVMe 直写探针，把内置系统盘（Windows 引导盘）当测试盘写坏（GPT/ESP）。
# QEMU 刮擦盘验收请用 _attic/limine-qemu-selftest.conf（--conf 传入）。
timeout: 5
serial: yes

/kernel/varix
    protocol: limine
    kernel_path: boot():/kernel/varix

/Windows 11 (USB)
    protocol: efi
    path: guid(636786cb-e967-49f6-b0df-7608909d1f11):/EFI/Microsoft/Boot/bootmgfw.efi

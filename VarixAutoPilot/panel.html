<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VarixAutoPilot · 对话自动化控制台</title>
<style>
  /* 深色工程风：不是极简，是信息密度优先。所有色值显式给出，不依赖主题变量。 */
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2128; --line: #30363d;
    --fg: #e6edf3; --fg2: #9198a1; --fg3: #6e7681;
    --ok: #3fb950; --warn: #d29922; --err: #f85149; --info: #58a6ff; --accent: #a371f7;
    --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 13px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 16px; flex: 0 0 auto; flex-wrap: wrap;
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  header h1 span { color: var(--accent); }
  .stat { display: flex; gap: 14px; font-size: 12px; color: var(--fg2); flex-wrap: wrap; }
  .stat b { color: var(--fg); font-family: var(--mono); font-weight: 600; }
  .spacer { flex: 1; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
  .dot.ok { background: var(--ok); } .dot.err { background: var(--err); }
  .dot.warn { background: var(--warn); } .dot.idle { background: var(--fg3); }

  main { flex: 1 1 auto; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  section { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  #left { border-right: 1px solid var(--line); }
  .bar {
    padding: 7px 14px; background: var(--panel2); border-bottom: 1px solid var(--line);
    font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--fg3);
    display: flex; align-items: center; gap: 10px; flex: 0 0 auto;
  }
  .bar .spacer { flex: 1; }
  .scroll { overflow-y: auto; flex: 1 1 auto; min-height: 0; }

  /* 对话卡片 */
  .conv {
    padding: 9px 14px; border-bottom: 1px solid var(--line); display: grid;
    grid-template-columns: 1fr auto; gap: 2px 10px; align-items: baseline;
  }
  .conv:hover { background: var(--panel2); }
  .conv.sel { background: #1f2937; box-shadow: inset 3px 0 0 var(--accent); }
  .conv .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv .rt { color: var(--fg3); font-size: 11px; white-space: nowrap; font-family: var(--mono); }
  .conv .meta { grid-column: 1 / -1; font-family: var(--mono); font-size: 11px; color: var(--fg2); }
  .conv .meta .k { color: var(--fg3); }
  .conv .meta .v { color: var(--info); }
  .conv .meta .v.path { color: var(--accent); word-break: break-all; }
  .tag {
    display: inline-block; padding: 0 5px; border-radius: 3px; font-size: 10px;
    border: 1px solid var(--line); color: var(--fg2); margin-left: 5px; vertical-align: 1px;
  }
  .tag.bad { color: var(--warn); border-color: #5a4a1e; }
  .tag.sel { color: var(--accent); border-color: #4b3a6b; }

  /* 表单 */
  .form { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; flex: 0 0 auto; }
  label { font-size: 11px; color: var(--fg3); text-transform: uppercase; letter-spacing: .6px; display: block; margin-bottom: 3px; }
  input[type=text], textarea {
    width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--line);
    border-radius: 4px; padding: 7px 9px; font-family: var(--mono); font-size: 12px; resize: vertical;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea.tpl { min-height: 150px; line-height: 1.5; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row label { margin: 0; }
  button {
    background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 4px; padding: 6px 13px; cursor: pointer; font-size: 12px; font-family: inherit;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  button.primary:hover:not(:disabled) { background: #388bfd; border-color: #388bfd; color: #fff; }
  button.danger { background: #8b1a1a; border-color: #8b1a1a; color: #fff; }
  button.danger:hover:not(:disabled) { background: #b62d2d; border-color: #b62d2d; color: #fff; }
  .sw { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; }
  .sw input { accent-color: var(--accent); cursor: pointer; }

  #log { font-family: var(--mono); font-size: 11px; line-height: 1.65; padding: 8px 14px; }
  #log div { white-space: pre-wrap; word-break: break-all; }
  #log .OK { color: var(--ok); } #log .ERR { color: var(--err); }
  #log .WARN { color: var(--warn); } #log .INFO { color: var(--info); }

  .preview {
    flex: 1 1 auto; min-height: 80px; overflow-y: auto; background: var(--bg);
    border: 1px solid var(--line); border-radius: 4px; padding: 9px;
    font-family: var(--mono); font-size: 11.5px; white-space: pre-wrap; color: var(--fg2);
  }
  .ph { color: var(--warn); background: #2a2410; padding: 0 3px; border-radius: 2px; }
  .note { font-size: 11px; color: var(--fg3); line-height: 1.5; }
  .note b { color: var(--fg2); }
  .badge { padding: 1px 6px; border-radius: 3px; font-size: 10px; font-family: var(--mono); }
  .badge.y { background: #2a2410; color: var(--warn); }
  .badge.n { background: #0f2b14; color: var(--ok); }
</style>
</head>
<body>
<header>
  <h1>Varix<span>AutoPilot</span></h1>
  <div class="stat">
    <span>对话 <b id="s-conv">–</b></span>
    <span>模型 <b id="s-model">–</b></span>
    <span>工作目录 <b id="s-cwd">–</b></span>
    <span>发送态 <b id="s-send">–</b></span>
    <span>版本 <b id="s-ver">–</b></span>
  </div>
  <div class="spacer"></div>
  <span class="note"><span class="dot idle" id="s-dot"></span><span id="s-msg">连接中…</span></span>
</header>

<main>
  <!-- 左：对话列表 -->
  <section id="left">
    <div class="bar">对话列表<span class="spacer"></span><span id="conv-count"></span></div>
    <div class="scroll" id="convs"></div>
  </section>

  <!-- 右：提示词 + 执行 + 日志 -->
  <section id="right">
    <div class="bar">提示词与执行</div>
    <div class="scroll" style="display:flex;flex-direction:column">
      <div class="form">
        <div>
          <label>变量（填这里，模板里的 {{键}} 会被替换）</label>
          <input type="text" id="v-task" placeholder="任务，例：VE-F0005 · 显存预算仲裁器">
          <div style="height:6px"></div>
          <textarea id="v-ctx" rows="3" placeholder="上下文，例：册/域/行数目标/前置/落点/门禁命令"></textarea>
        </div>
        <div>
          <label>模板</label>
          <textarea id="tpl" class="tpl"></textarea>
        </div>
        <div class="row">
          <label class="sw"><input type="checkbox" id="o-new" checked> 先开新对话</label>
          <label class="sw"><input type="checkbox" id="o-dry" checked> 只填不发（干跑）</label>
          <button onclick="saveSettings()">保存</button>
          <button onclick="doPreview()">预览</button>
          <div class="spacer" style="flex:1"></div>
          <button class="primary" id="b-send" onclick="doSend(false)">填入</button>
          <button class="danger" id="b-sendreal" onclick="doSend(true)">填入并发送</button>
        </div>
        <div class="note" id="hint"></div>
      </div>
      <div style="padding:0 14px 10px;display:flex;flex-direction:column;flex:1 1 auto;min-height:0">
        <label>渲染预览</label>
        <div class="preview" id="preview"></div>
      </div>
      <div class="bar">日志</div>
      <div class="scroll" id="logwrap" style="flex:0 0 190px">
        <div id="log"></div>
      </div>
    </div>
  </section>
</main>

<script type="module" src="/panel.js"></script>
</body>
</html>

<!doctype html>
<!-- Standalone harness: renders the exact projectviz aurora shader
     (src/features/projectviz/auroraShader.ts) over a simplified deep-sky
     gradient, so the multi-ribbon art direction can be verified without Tauri.
     Query: ?t=12.34 static frame at that time; ?anim=1 continuous motion. -->
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>Aurora Canvas Preview</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070f; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #info { position: fixed; left: 8px; top: 8px; color: #9fb6d8; font: 12px/1.6 monospace; z-index: 2; text-shadow: 0 1px 2px #000; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">aurora canvas preview</div>
<script type="module">
  import { VERT, FRAG_AURORA } from "/src/features/projectviz/auroraShader";

  // 简化深空底衬（与 FRAG_BG 同色系：暗角 + 中央压暗），仅作极光的承载背景
  const FRAG_SKY = `#version 300 es
  precision highp float;
  in vec2 vUv;
  out vec4 outColor;
  void main() {
    vec2 uv = vUv;
    vec3 top = vec3(0.012, 0.020, 0.055);
    vec3 bottom = vec3(0.045, 0.075, 0.150);
    vec3 col = mix(bottom, top, pow(uv.y, 0.8));
    col += vec3(0.05, 0.09, 0.17) * max(0.0, pow(1.0 - abs(uv.y - 0.75) * 1.2, 3.0));
    vec2 c = uv - 0.5;
    col *= clamp(1.0 - dot(c, c) * 0.85, 0.55, 1.0);
    col *= 1.0 - smoothstep(0.18, 0.45, length(c)) * 0.30;
    outColor = vec4(col, 1.0);
  }`;

  const canvas = document.getElementById("c");
  const gl = canvas.getContext("webgl2", { alpha: false, antialias: false, powerPreference: "high-performance" });
  if (!gl) { document.getElementById("info").textContent = "WebGL2 unavailable"; throw new Error("no webgl2"); }

  const compile = (type, src) => {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      document.getElementById("info").textContent = "compile failed: " + gl.getShaderInfoLog(sh);
      throw new Error(gl.getShaderInfoLog(sh));
    }
    return sh;
  };
  const program = (vs, fs) => {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    return p;
  };

  const progSky = program(VERT, FRAG_SKY);
  const progAu = program(VERT, FRAG_AURORA);
  document.getElementById("info").textContent = "aurora canvas preview — shaders OK";

  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  const uTimeSky = gl.getUniformLocation(progSky, "uTime");
  const uTimeAu = gl.getUniformLocation(progAu, "uTime");
  const uCamAu = gl.getUniformLocation(progAu, "uCam");

  const q = new URLSearchParams(location.search);
  const dpr = Math.min(window.devicePixelRatio || 1, 1.25);
  const resize = () => {
    const w = Math.max(1, Math.round(innerWidth * dpr));
    const h = Math.max(1, Math.round(innerHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    gl.viewport(0, 0, w, h);
  };

  const draw = (time) => {
    resize();
    gl.disable(gl.BLEND);
    gl.useProgram(progSky);
    gl.uniform1f(uTimeSky, time);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(progAu);
    gl.uniform1f(uTimeAu, time);
    gl.uniform2f(uCamAu, 0, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  };

  if (q.get("anim") === "1") {
    const t0 = performance.now();
    const loop = (now) => { draw((now - t0) / 1000); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  } else {
    draw(parseFloat(q.get("t") ?? "12.34") || 12.34);
  }
</script>
</body>
</html>

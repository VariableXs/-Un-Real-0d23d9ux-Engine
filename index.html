<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Variable — Private Space</title>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { background: #05070d; color: #dfe7f5; font-family: "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif; overflow: hidden; }
      #boot-splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(1200px 700px at 50% 40%, #0a1226 0%, #05070d 70%); z-index: 9999; transition: opacity .45s ease; }
      #boot-splash.done { opacity: 0; pointer-events: none; }
      #boot-splash span { letter-spacing: .35em; font-size: 15px; color: #7f97c4; opacity: .85; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash"><span>V A R I A B L E</span></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

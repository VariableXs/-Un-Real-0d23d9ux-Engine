name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: L1 typecheck
        run: npm run typecheck
      - name: L2 unit tests (vitest)
        run: npm test -- --run
      - name: L4 static audit (IPC surface + i18n)
        run: node tools/audit.cjs
      - name: "L4.5 keymap CI gate (M-83: bare-keydown baseline + binds conflicts/reserved)"
        run: node tools/keymap-audit.cjs
      - name: "L4.6 doc link check (M-86: relative links + anchors, exit 1 on broken)"
        run: node tools/link-check.cjs
      - name: L5 frontend build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: error

  backend:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: L3 backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  kernel:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: x86_64-unknown-none,x86_64-pc-windows-msvc
          components: rust-src, rustfmt, clippy, llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kernel
      - name: K1 static check (x86_64-unknown-none)
        run: cargo kcheck
        working-directory: kernel
      - name: K2 host tests
        # --lib：域模块纯逻辑测试全量覆盖；全量 ktest 会因 bin varix（msvc
        # target）unwinding panic 误报失败（见 .workbuddy 记忆 2026-09-12）。
        run: cargo ktest --lib
        working-directory: kernel
      - name: K3 fuzz harness (bounded)
        run: cargo ktest --test fuzz
        working-directory: kernel
      - name: K4 kernel build (zero errors)
        run: cargo kbuild
        working-directory: kernel
      - uses: actions/upload-artifact@v4
        with:
          name: varix-elf
          path: kernel/target/x86_64-unknown-none/release/varix
          retention-days: 7
          if-no-files-found: error

  # F196 · CI boot job：内核 + initrd + ISO 三产物，并在 QEMU 里做冒烟引导。
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: x86_64-unknown-none,x86_64-pc-windows-msvc
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kernel
      - name: B1 install image tooling (xorriso + qemu + limine)
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso qemu-system-x86 curl
          # 注意：limine-<ver>.tar.gz 是【源码包】（只有 configure / host/limine.c，
          # 没有任何预编译 .bin）。必须下 limine-binary.tar.gz。其首层目录就是
          # limine-binary/，因此【不要】加 --strip-components，否则文件会落到
          # tools/limine/*.bin，而 scripts/make-iso.sh 读的是
          # tools/limine/limine-binary/*.bin —— 路径不匹配会在 B5 才炸。
          for v in v12.1.0 v12.9.0; do
            if curl -fsSL -o /tmp/limine.tar.gz \
              "https://github.com/limine-bootloader/limine/releases/download/$v/limine-binary.tar.gz"; then
              echo "limine binary release: $v"
              break
            fi
          done
          mkdir -p tools/limine
          tar -xzf /tmp/limine.tar.gz -C tools/limine
          # 硬门禁：路径不对就让 B1 立刻红，而不是拖到 B5 才暴露。
          test -f tools/limine/limine-binary/limine-bios-cd.bin
          test -f tools/limine/limine-binary/limine-uefi-cd.bin
          test -f tools/limine/limine-binary/limine-bios.sys
          ls -l tools/limine/limine-binary/limine-bios-cd.bin \
                tools/limine/limine-binary/limine-uefi-cd.bin \
                tools/limine/limine-binary/limine-bios.sys
      - name: B2 kernel build
        run: cargo kbuild
        working-directory: kernel
      - name: B3 initrd pipeline (F180)
        run: python3 scripts/make-initfs.py --verbose
      - name: B4 initrd TOC self-check
        run: python3 scripts/make-initfs.py --check
      - name: "B5 ISO artifact (F181: BIOS + UEFI dual boot via xorriso)"
        run: bash scripts/make-iso.sh
      - name: "B6 USB artifact (F182: dd-writable hybrid image + GPT backup)"
        run: |
          # varix.iso 由 xorriso 以 --protective-msdos-label + -isohybrid-gpt-basdat 产出，
          # 本身即「混合 MBR + 盘尾 GPT 备份表」的 dd 可写镜像，故 USB 产物就是它。
          cp varix.iso varix-usb.img
          ls -l varix.iso varix-usb.img
          # 实测而非只看模型常量：直接读镜像字节验证 GPT——
          # 主 GPT 头在 LBA1（偏移 512）有 "EFI PART"，备份 GPT 头在最后一个 LBA。
          python3 - <<'PYEOF'
          import sys
          data = open("varix-usb.img", "rb").read()
          assert data[510:512] == b"\x55\xaa", "FAIL: no 0x55AA MBR signature"
          assert data[512:520] == b"EFI PART", "FAIL: primary GPT header missing"
          tail = data[-512:]
          assert tail[:8] == b"EFI PART", "FAIL: backup GPT header (last LBA) missing"
          print("OK: hybrid MBR + primary/backup GPT verified by byte inspection")
          PYEOF
      - name: B7 smoke boot in QEMU (serial log + self-test gate)
        run: |
          set +e
          timeout 90 qemu-system-x86_64 \
            -cdrom varix.iso -serial file:serial.log \
            -display none -no-reboot -no-shutdown -m 512M -M q35
          rc=$?
          echo "qemu exit=$rc"
          echo "----- serial.log (tail) -----"
          tail -60 serial.log || true
          # 冒烟门禁：内核必须跑到 boot complete，且无致命异常。
          grep -q "boot complete" serial.log || { echo "FAIL: kernel did not reach boot complete"; exit 1; }
          grep -q "limine: Loading executable" serial.log || { echo "FAIL: limine did not load the kernel"; exit 1; }
          if grep -qiE "fatal exception|page fault|general protection|triple fault" serial.log; then
            echo "FAIL: fatal exception in serial log"; exit 1
          fi
          echo "OK: smoke boot passed"
      - uses: actions/upload-artifact@v4
        with:
          name: varix-iso
          path: |
            varix.iso
            varix-usb.img
            build/initrd.img
          retention-days: 7
          if-no-files-found: error
      - name: B8 serial log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-serial-log
          path: serial.log
          retention-days: 7
          if-no-files-found: warn

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: L1 typecheck
        run: npm run typecheck
      - name: L2 unit tests (vitest)
        run: npm test -- --run
      - name: L4 static audit (IPC surface + i18n)
        run: node tools/audit.cjs
      - name: L4.5 keymap CI gate (M-83: bare-keydown baseline + binds conflicts/reserved)
        run: node tools/keymap-audit.cjs
      - name: L4.6 doc link check (M-86: relative links + anchors, exit 1 on broken)
        run: node tools/link-check.cjs
      - name: L5 frontend build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: error

  backend:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: L3 backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  kernel:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: x86_64-unknown-none,x86_64-pc-windows-msvc
          components: rust-src, rustfmt, clippy, llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kernel
      - name: K1 static check (x86_64-unknown-none)
        run: cargo kcheck
        working-directory: kernel
      - name: K2 host tests
        run: cargo ktest
        working-directory: kernel
      - name: K3 fuzz harness (bounded)
        run: cargo ktest --test fuzz
        working-directory: kernel
      - name: K4 kernel build (zero errors)
        run: cargo kbuild
        working-directory: kernel
      - uses: actions/upload-artifact@v4
        with:
          name: varix-elf
          path: kernel/target/x86_64-unknown-none/release/varix
          retention-days: 7
          if-no-files-found: error

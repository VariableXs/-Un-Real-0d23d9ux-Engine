# B-2903 panic 对练专用 conf（WP-106 · panic_test=1 注入）。
# 仅限 QEMU 对练使用（scripts/panic-drill.sh 经 make-iso-qemu.py --conf 传入）；
# 绝不可用于真机部署——真机每次开机都会在引导完成后注入 panic。
# 真机事实源 = repo 根 limine.conf（永不携带此开关）。
timeout: 0
serial: yes

/kernel/varix
    protocol: limine
    kernel_path: boot():/kernel/varix
    kernel_cmdline: panic_test=1

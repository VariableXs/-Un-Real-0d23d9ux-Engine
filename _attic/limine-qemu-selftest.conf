# QEMU 刮擦盘验收专用 conf（storage_selftest=1）。
# 仅限 QEMU 使用（第一个 NVMe = t7-testdisk 专用刮擦盘）；
# 绝不可用于真机部署 —— 真机第一个 NVMe 是内置系统盘（Windows 引导盘），
# 开此开关会直写 GPT 表项数组与 ESP（2026-09-22 实机事故根因）。
# 真机事实源 = repo 根 limine.conf（永不携带此开关）。
timeout: 0
serial: yes

/kernel/varix
    protocol: limine
    kernel_path: boot():/kernel/varix
    kernel_cmdline: storage_selftest=1

# 三卡菜单验证用 Limine 配置（仅 QEMU 验证，不用于实机部署）
# 与正式 build/isoroot/limine.conf 的差别：
#   timeout: 0            —— Limine 自身不出菜单，直接引导内核（同正式）
#   kernel_cmdline 里 boot_timeout=60 —— 让内核自己的三卡菜单亮出来并停留
#                            60s（MAX_TIMEOUT_SECS 上限）。TCG 下计时会漂移，
#                            给足键注入与截图窗口；正式盘为 0（直接进 Variable）。
timeout: 0
serial: yes

/kernel/varix
    protocol: limine
    kernel_path: boot():/kernel/varix
    kernel_cmdline: boot_timeout=60 boot_default=varix
